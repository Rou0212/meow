<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>喵模會館 來客</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Cinzel:wght@600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5EBDD; --surface:#FCF8F1; --surface-2:#F1E6D4; --inset:#F7EEE0;
  --ink:#493629; --ink-soft:#7C6656; --muted:#A99A8A; --line:#EBDBC5;
  --rose:#E0959D; --rose-deep:#CF7D88; --rose-soft:#F8E4E3; --rose-ink:#B5606C;
  --tan:#E6D4B8; --tan-deep:#C9AE85; --tan-ink:#977B52;
  --sage:#8FAD8B; --gold:#D6A33F; --espresso:#3A2C25; --espresso-2:#4A392F;
  --espresso-ink:#F3E8D9; --espresso-soft:#C7B4A2;
  --sc-ig:#E3959D; --sc-google:#E0B15E; --sc-friend:#9BBE9A; --sc-threads:#9FB0C6;
  --sc-red:#D98A6A; --sc-tiktok:#78BBB2; --sc-walk:#B8A6DA; --sc-map:#6FA9C9; --sc-other:#AB8E78;
  --shadow:0 6px 22px rgba(90,63,42,.10); --shadow-lg:0 14px 40px rgba(90,63,42,.16);
  --radius:20px;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --bg:#211A15; --surface:#2C241E; --surface-2:#382D25; --inset:#31281F;
    --ink:#F0E5D6; --ink-soft:#C7B6A4; --muted:#8C7B6B; --line:#463629;
    --rose:#E6A2AA; --rose-deep:#EDB2B9; --rose-soft:#43302E; --rose-ink:#EBA9B1;
    --tan:#4E3E30; --tan-deep:#7C6549; --tan-ink:#D8BE95;
    --sage:#9DBE99; --gold:#E0B25A; --espresso:#171009; --espresso-2:#241A12;
    --espresso-ink:#F1E6D6; --espresso-soft:#B6A390;
    --sc-ig:#E6A0A8; --sc-google:#E4BC72; --sc-friend:#A9CBA7; --sc-threads:#AEBFD3;
    --sc-red:#E29B7D; --sc-tiktok:#8BC9C0; --sc-walk:#C4B4E1; --sc-map:#8FBEDC; --sc-other:#BC9E86;
    --shadow:0 6px 22px rgba(0,0,0,.30); --shadow-lg:0 14px 40px rgba(0,0,0,.42);
  }
}
:root[data-theme="dark"]{
  --bg:#211A15; --surface:#2C241E; --surface-2:#382D25; --inset:#31281F;
  --ink:#F0E5D6; --ink-soft:#C7B6A4; --muted:#8C7B6B; --line:#463629;
  --rose:#E6A2AA; --rose-deep:#EDB2B9; --rose-soft:#43302E; --rose-ink:#EBA9B1;
  --tan:#4E3E30; --tan-deep:#7C6549; --tan-ink:#D8BE95;
  --sage:#9DBE99; --gold:#E0B25A; --espresso:#171009; --espresso-2:#241A12;
  --espresso-ink:#F1E6D6; --espresso-soft:#B6A390;
  --sc-ig:#E6A0A8; --sc-google:#E4BC72; --sc-friend:#A9CBA7; --sc-threads:#AEBFD3;
  --sc-red:#E29B7D; --sc-tiktok:#8BC9C0; --sc-walk:#C4B4E1; --sc-other:#BC9E86;
  --shadow:0 6px 22px rgba(0,0,0,.30); --shadow-lg:0 14px 40px rgba(0,0,0,.42);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  -webkit-font-smoothing:antialiased; line-height:1.5;
  min-height:100vh; min-height:100dvh;
}
.num{font-family:"Baloo 2","Noto Sans TC",sans-serif; font-variant-numeric:tabular-nums; font-feature-settings:"tnum"}
.brand{font-family:"Cinzel",serif; letter-spacing:.14em}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}
:focus-visible{outline:3px solid var(--rose); outline-offset:2px; border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important; transition-duration:.001ms!important}}

/* ===== paw bg ===== */
.paw{display:inline-block; vertical-align:middle}

/* ============ REGISTRATION ============ */
#reg{min-height:100dvh; display:flex; flex-direction:column; align-items:center; padding:18px 16px 40px; position:relative; overflow:hidden}
#reg::before{content:""; position:absolute; inset:0; background-image:radial-gradient(circle at 12% 20%, rgba(214,163,63,.05) 0 3px, transparent 4px),radial-gradient(circle at 82% 68%, rgba(224,149,157,.05) 0 3px, transparent 4px); background-size:120px 120px; pointer-events:none}
.reg-top{width:100%; max-width:560px; display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; z-index:2}
.reg-top .tag{font-size:12px; letter-spacing:.05em; color:var(--muted)}
.link-btn{display:inline-flex; align-items:center; gap:6px; padding:9px 15px; border-radius:999px; background:var(--surface); border:1.5px solid var(--line); color:var(--ink-soft); font-size:14px; font-weight:500; box-shadow:var(--shadow)}
.link-btn:hover{border-color:var(--rose); color:var(--rose-ink)}
.card{width:100%; max-width:560px; background:var(--surface); border:1.5px solid var(--line); border-radius:28px; box-shadow:var(--shadow-lg); padding:34px 26px 30px; margin-top:14px; z-index:2; position:relative}
.crest{display:flex; flex-direction:column; align-items:center; gap:2px; margin-bottom:8px}
.wordmark{font-family:"Noto Serif TC",serif; font-weight:900; letter-spacing:.18em; font-size:30px; text-align:center; color:var(--ink); line-height:1.2; padding-left:.18em}
.crest-en{font-family:"Cinzel",serif; font-weight:600; letter-spacing:.22em; font-size:12px; color:var(--tan-ink); text-align:center; margin-top:5px}
.crest-sub{font-size:11px; letter-spacing:.32em; color:var(--tan-ink); font-weight:700; margin-top:3px}
.q-title{text-align:center; font-size:20px; font-weight:700; margin:16px 0 4px; text-wrap:balance}
.q-sub{text-align:center; color:var(--ink-soft); font-size:14px; margin-bottom:20px}
.hi{color:var(--rose-ink)}
.choices{display:flex; flex-direction:column; gap:14px; margin-top:6px}
.big-btn{display:flex; align-items:center; gap:14px; width:100%; padding:18px 20px; border-radius:18px; font-size:18px; font-weight:700; border:2px solid transparent; transition:transform .12s, box-shadow .12s, background .12s}
.big-btn .ico{width:30px; height:30px; flex:none; display:grid; place-items:center}
.big-btn:active{transform:scale(.98)}
.btn-rose{background:var(--rose); color:#fff; box-shadow:0 8px 18px rgba(207,125,136,.34)}
.btn-rose:hover{background:var(--rose-deep)}
.btn-tan{background:var(--tan); color:var(--tan-ink); box-shadow:0 6px 14px rgba(201,174,133,.28)}
.btn-tan:hover{filter:brightness(.98)}
[data-theme="dark"] .btn-tan, :root:not([data-theme="light"]) .btn-tan{color:var(--tan-ink)}

.src-list{display:flex; flex-direction:column; gap:11px}
.src-btn{display:flex; align-items:center; gap:14px; width:100%; padding:15px 18px; border-radius:15px; font-size:16.5px; font-weight:500; background:var(--inset); border:1.5px solid var(--line); color:var(--ink); text-align:left; transition:transform .1s, border-color .12s, background .12s}
.src-btn .emo{font-size:20px; width:26px; text-align:center; flex:none}
.src-btn:hover{border-color:var(--rose); background:var(--surface)}
.src-btn:active{transform:scale(.985)}
.src-btn.other{border-style:dashed; border-color:var(--tan-deep); color:var(--tan-ink)}
.src-btn .arr{margin-left:auto; color:var(--muted); font-size:18px}

.step-head{display:flex; align-items:center; gap:10px; margin-bottom:4px}
.back{width:38px; height:38px; border-radius:50%; background:var(--inset); border:1.5px solid var(--line); font-size:18px; color:var(--ink-soft); display:grid; place-items:center; flex:none}
.back:hover{border-color:var(--rose); color:var(--rose-ink)}

.other-wrap{display:flex; flex-direction:column; gap:8px; margin-top:6px}
.other-input{width:100%; padding:16px; border-radius:15px; border:1.5px solid var(--line); background:var(--inset); color:var(--ink); font-size:17px; font-family:inherit; resize:none; min-height:96px}
.other-input:focus{border-color:var(--rose); outline:none}
.counter{text-align:right; font-size:12px; color:var(--muted)}

.done-wrap{text-align:center; padding:6px 0 4px}
.done-title{font-size:24px; font-weight:900; margin:6px 0 4px; color:var(--ink)}
.done-sub{color:var(--ink-soft); font-size:15px; margin:14px 0 22px}
.spark{color:var(--gold)}
.mini-summary{display:inline-flex; align-items:center; gap:10px; background:var(--rose-soft); color:var(--rose-ink); padding:8px 16px; border-radius:999px; font-size:13.5px; font-weight:700; margin-top:2px}
.today-tally{margin-top:16px; text-align:center; font-size:13px; color:var(--muted)}
.today-tally b{color:var(--ink-soft)}

.deco-cats{display:flex; justify-content:center; gap:2px; margin-top:20px; opacity:.9; z-index:2}
.deco-cats svg{width:52px; height:52px}

/* ============ STATS ============ */
#stats{display:none; min-height:100dvh}
#stats.on{display:flex}
.sidebar{width:236px; flex:none; background:var(--espresso); color:var(--espresso-ink); display:flex; flex-direction:column; padding:22px 16px; position:sticky; top:0; height:100dvh}
.sb-brand{display:flex; flex-direction:column; align-items:center; gap:8px; padding:6px 0 18px; border-bottom:1px solid rgba(255,255,255,.09)}
.sb-brand .wm{font-family:"Noto Serif TC",serif; font-weight:900; letter-spacing:.16em; font-size:20px; text-align:center; color:var(--espresso-ink); line-height:1.3; padding-left:.16em}
.sb-brand .wm-en{font-family:"Cinzel",serif; font-weight:600; letter-spacing:.18em; font-size:9.5px; text-align:center; color:var(--espresso-soft); margin-top:4px}
.sb-nav{display:flex; flex-direction:column; gap:3px; margin-top:16px}
.sb-item{display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:13px; font-size:15px; font-weight:500; color:var(--espresso-soft); text-align:left; transition:background .12s, color .12s}
.sb-item .emo{font-size:17px; width:20px; text-align:center}
.sb-item:hover{background:rgba(255,255,255,.06); color:var(--espresso-ink)}
.sb-item.active{background:var(--rose); color:#fff; box-shadow:0 6px 14px rgba(0,0,0,.22)}
.sb-spacer{flex:1}
.sb-back{display:flex; align-items:center; justify-content:center; gap:8px; padding:12px; border-radius:13px; background:rgba(255,255,255,.08); color:var(--espresso-ink); font-size:14px; font-weight:700; margin-top:10px}
.sb-back:hover{background:rgba(255,255,255,.15)}
.sb-cat{display:flex; justify-content:center; margin-top:14px; opacity:.92}
.sb-cat svg{width:96px; height:96px}

.main{flex:1; min-width:0; padding:26px 30px 60px}
.main-head{display:flex; flex-wrap:wrap; gap:14px; align-items:center; justify-content:space-between; margin-bottom:20px}
.main-title{font-size:24px; font-weight:900; letter-spacing:.01em}
.filters{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
.chip-row{display:inline-flex; background:var(--surface); border:1.5px solid var(--line); border-radius:999px; padding:4px; gap:2px}
.chip{padding:8px 16px; border-radius:999px; font-size:14px; font-weight:700; color:var(--ink-soft); transition:background .12s,color .12s}
.chip.active{background:var(--rose); color:#fff}
.chip:hover:not(.active){color:var(--rose-ink)}
.date-box{display:inline-flex; align-items:center; gap:8px; background:var(--surface); border:1.5px solid var(--line); border-radius:14px; padding:8px 14px; font-size:13.5px; color:var(--ink-soft); font-weight:600}
.date-box input{border:none; background:transparent; color:var(--ink); font-family:inherit; font-size:13.5px; width:120px}
.date-box input::-webkit-calendar-picker-indicator{opacity:.5}
.date-box .tilde{color:var(--muted)}

.section-title{font-size:16px; font-weight:900; margin:0 0 14px; display:flex; align-items:center; gap:8px}

.tiles{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:22px}
.tile{background:var(--surface); border:1.5px solid var(--line); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow); position:relative; overflow:hidden}
.tile .lbl{font-size:13.5px; color:var(--ink-soft); font-weight:700; display:flex; align-items:center; gap:7px}
.tile .lbl .emo{font-size:16px}
.tile .val{font-size:34px; font-weight:800; margin-top:8px; line-height:1; display:flex; align-items:baseline; gap:5px}
.tile .val .unit{font-size:15px; color:var(--muted); font-weight:700; font-family:"Noto Sans TC"}
.tile .sub{margin-top:8px; font-size:14px; font-weight:800}
.tile .sub.dash{color:var(--muted); font-weight:500}
.tile.rose .val{color:var(--rose-ink)} .tile.rose .sub{color:var(--rose-ink)}
.tile.tan .val{color:var(--tan-ink)} .tile.tan .sub{color:var(--tan-ink)}
.tile.gold .val{color:var(--gold)}

.panels{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:22px}
.panel{background:var(--surface); border:1.5px solid var(--line); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow)}
.panel.full{grid-column:1/-1}

/* donut */
.donut-wrap{display:flex; gap:20px; align-items:center; flex-wrap:wrap}
.donut{position:relative; width:190px; height:190px; flex:none}
.donut .center{position:absolute; inset:0; display:grid; place-content:center; text-align:center}
.donut .center .t1{font-size:11px; color:var(--muted); font-weight:700}
.donut .center .t2{font-size:27px; font-weight:800; color:var(--ink)}
.donut .center .t3{font-size:11px; color:var(--muted)}
.legend{flex:1; min-width:190px; display:flex; flex-direction:column; gap:8px}
.leg-row{display:flex; align-items:center; gap:9px; font-size:13.5px; padding:2px 0}
.leg-row .dot{width:11px; height:11px; border-radius:3.5px; flex:none}
.leg-row .name{font-weight:600; color:var(--ink)}
.leg-row .pct{margin-left:auto; color:var(--muted); font-weight:700; font-variant-numeric:tabular-nums}
.leg-row .cnt{color:var(--ink-soft); font-weight:800; width:44px; text-align:right; font-variant-numeric:tabular-nums}

/* bars */
.bars{display:flex; flex-direction:column; gap:12px; margin-top:4px}
.bar-row{display:grid; grid-template-columns:96px 1fr 46px; gap:12px; align-items:center; font-size:13.5px}
.bar-row .bl{font-weight:600; color:var(--ink); display:flex; align-items:center; gap:7px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.bar-row .bl .dot{width:10px;height:10px;border-radius:3px;flex:none}
.bar-track{height:15px; background:var(--inset); border-radius:8px; overflow:hidden}
.bar-fill{height:100%; border-radius:8px; transition:width .5s cubic-bezier(.4,0,.2,1)}
.bar-row .bv{text-align:right; font-weight:800; color:var(--ink); font-variant-numeric:tabular-nums}

/* line chart */
.linechart{width:100%; height:230px}
.chart-legend{display:flex; gap:18px; justify-content:flex-end; margin-bottom:4px; font-size:13px; font-weight:700}
.chart-legend span{display:inline-flex; align-items:center; gap:6px; color:var(--ink-soft)}
.chart-legend .k{width:16px; height:4px; border-radius:2px}

/* tables */
.table-scroll{overflow-x:auto; border:1.5px solid var(--line); border-radius:16px; background:var(--surface)}
table{border-collapse:collapse; width:100%; font-size:13.5px; min-width:640px}
thead th{background:var(--surface-2); color:var(--ink-soft); font-weight:800; text-align:right; padding:12px 14px; position:sticky; top:0; white-space:nowrap}
thead th:first-child{text-align:left}
tbody td{padding:11px 14px; text-align:right; border-top:1px solid var(--line); font-variant-numeric:tabular-nums; white-space:nowrap}
tbody td:first-child{text-align:left; font-weight:600}
tbody tr:hover{background:var(--inset)}
.pill{display:inline-block; padding:3px 11px; border-radius:999px; font-size:12px; font-weight:800}
.pill.new{background:var(--rose-soft); color:var(--rose-ink)}
.pill.ret{background:var(--surface-2); color:var(--tan-ink)}
.src-tag{display:inline-flex; align-items:center; gap:6px; font-weight:600}
.src-tag .dot{width:9px;height:9px;border-radius:3px}
.note-x{color:var(--muted); font-size:12px; margin-left:4px}
.detail-controls{display:flex; gap:10px; align-items:center; margin-bottom:12px; flex-wrap:wrap}
.mini-note{font-size:12.5px; color:var(--muted)}
.empty{padding:40px; text-align:center; color:var(--muted); font-size:14px}

/* settings */
.set-card{background:var(--surface); border:1.5px solid var(--line); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow); margin-bottom:14px; max-width:600px}
.set-row{display:flex; align-items:center; justify-content:space-between; gap:16px}
.set-row .st{font-weight:700; font-size:15px}
.set-row .sd{font-size:13px; color:var(--ink-soft); margin-top:3px; max-width:400px}
.switch{width:52px; height:30px; border-radius:999px; background:var(--surface-2); border:1.5px solid var(--line); position:relative; flex:none; transition:background .15s}
.switch::after{content:""; position:absolute; top:2px; left:2px; width:24px; height:24px; border-radius:50%; background:#fff; box-shadow:0 2px 4px rgba(0,0,0,.2); transition:transform .18s}
.switch.on{background:var(--rose); border-color:var(--rose)}
.switch.on::after{transform:translateX(22px)}
.btn-outline{padding:10px 18px; border-radius:12px; border:1.5px solid var(--line); background:var(--surface); font-weight:700; font-size:14px; color:var(--ink)}
.btn-outline:hover{border-color:var(--rose); color:var(--rose-ink)}
.btn-danger{padding:10px 18px; border-radius:12px; border:1.5px solid var(--rose); background:transparent; font-weight:700; font-size:14px; color:var(--rose-ink)}
.btn-danger:hover{background:var(--rose-soft)}
.sync-badge{display:inline-flex; align-items:center; gap:7px; font-size:12.5px; font-weight:700; padding:6px 13px; border-radius:999px}
.sync-badge.shared{background:var(--rose-soft); color:var(--rose-ink)}
.sync-badge.local{background:var(--surface-2); color:var(--tan-ink)}

/* toast */
#toast{position:fixed; left:50%; bottom:30px; transform:translateX(-50%) translateY(20px); background:var(--espresso); color:var(--espresso-ink); padding:13px 22px; border-radius:999px; font-weight:700; font-size:14.5px; box-shadow:var(--shadow-lg); opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; z-index:50; display:flex; align-items:center; gap:9px}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

.theme-toggle{position:fixed; right:14px; bottom:14px; width:42px; height:42px; border-radius:50%; background:var(--surface); border:1.5px solid var(--line); font-size:18px; display:grid; place-items:center; box-shadow:var(--shadow); z-index:40}

/* mobile */
@media (max-width:860px){
  .tiles{grid-template-columns:1fr 1fr}
  .panels{grid-template-columns:1fr}
}
@media (max-width:720px){
  #stats.on{flex-direction:column}
  .sidebar{width:100%; height:auto; position:static; flex-direction:row; align-items:center; padding:10px; gap:8px; overflow-x:auto}
  .sb-brand{display:none}
  .sb-nav{flex-direction:row; margin-top:0; gap:6px; flex:1}
  .sb-item{padding:9px 12px; white-space:nowrap; font-size:13.5px}
  .sb-item .emo{display:none}
  .sb-spacer,.sb-cat{display:none}
  .sb-back{margin-top:0; padding:9px 12px; white-space:nowrap}
  .main{padding:18px 15px 60px}
  .main-title{font-size:20px}
}
@media (max-width:480px){
  .tiles{grid-template-columns:1fr 1fr; gap:11px}
  .tile .val{font-size:28px}
  .card{padding:26px 18px 24px}
}
</style>
</head>
<body>

<!-- ==================== REGISTRATION ==================== -->
<main id="reg">
  <div class="reg-top">
    <span class="tag">🐾 客人登記</span>
    <button class="link-btn" id="goStats">📊 查看統計</button>
  </div>
  <div class="card" id="regCard"><!-- rendered by JS --></div>
  <div class="deco-cats" id="decoCats"></div>
</main>

<!-- ==================== STATS ==================== -->
<div id="stats">
  <aside class="sidebar">
    <div class="sb-brand">
      <div id="sbCat"></div>
      <div class="wm">喵模會館</div>
      <div class="wm-en">MEOW GUILD HALL</div>
    </div>
    <nav class="sb-nav" id="sbNav"></nav>
    <div class="sb-spacer"></div>
    <button class="sb-back" id="goReg">🐾 返回客人登記</button>
    <div class="sb-cat" id="sbCatBig"></div>
  </aside>
  <div class="main">
    <div class="main-head">
      <div class="main-title" id="secHeading">統計總覽</div>
      <div class="filters" id="filters">
        <div class="chip-row" id="chipRow">
          <button class="chip" data-f="today">今日</button>
          <button class="chip" data-f="week">本週</button>
          <button class="chip active" data-f="month">本月</button>
          <button class="chip" data-f="custom">自訂日期</button>

function mergeView(){

async function refreshFromServer(){
  const url=backendUrl(); if(!url) return false;
  try{
    const res=await fetch(url+(url.indexOf("?")>=0?"&":"?")+"t="+Date.now(), {method:"GET"});
    const data=await res.json();
    if(data && data.ok && Array.isArray(data.records)){
      realRecords = data.records.map(rowToRec);
      online=true; syncMode="shared";
      mergeView();
      return true;
    }
  }catch(e){ online=false; }
  return false;
}
async function flushOutbox(){

    isNew:isNew?1:0, src:srcIdx, note:note||""

function dailyBreakdown(recs){
  const map={};

  if(state.step===1) return renderStep1();
  if(state.step===2) return renderStep2();
  if(state.step===3) return renderStep3();
  if(state.step===4) return renderDone();
}
function renderStep1(){
  regCard.innerHTML=`
    <div class="crest">
      ${catSVG().replace('<svg','<svg style="width:96px;height:100px"')}
      <div class="wordmark">喵模會館</div>
      <div class="crest-en">MEOW GUILD HALL</div>
      <div class="crest-sub">貓 咖 來 客 登 記</div>
    </div>
    <div class="q-title">今天是第一次來我們店嗎？</div>
    <div class="q-sub">想請問你～由店員協助點選就可以囉 🐾</div>
    <div class="choices">
      <button class="big-btn btn-rose" data-new="1"><span class="ico">${smallCatWhite()}</span>🆕 第一次來（新客）</button>
      <button class="big-btn btn-tan" data-new="0"><span class="ico">${pawMini('currentColor')}</span>🐾 來過了（回訪客）</button>
    </div>
    <div class="q-sub" style="margin:14px 0 0;font-size:12.5px">回訪客點一下就完成囉,不用再問來源 🐾</div>
    <div class="today-tally" id="todayTally"></div>`;
  regCard.querySelectorAll("[data-new]").forEach(b=>b.onclick=()=>{
    state.isNew=+b.dataset.new;
    if(state.isNew){ state.step=2; renderReg(); }   // 新客 → 問來源
    else { commit(null, ""); }                       // 回訪 → 直接記錄
  });
  updateTodayTally();
}
function smallCatWhite(){ return `<svg width="26" height="26" viewBox="0 0 60 60" aria-hidden="true"><path d="M18 20 L13 8 L25 16 Z" fill="#fff"/><path d="M42 20 L47 8 L35 16 Z" fill="#fff"/><circle cx="30" cy="30" r="17" fill="#fff"/><path d="M23 30 q3 3 6 0" stroke="#e0959d" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M31 30 q3 3 6 0" stroke="#e0959d" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>`; }
function renderStep2(){
  regCard.innerHTML=`
    <div class="step-head">
      <button class="back" id="back2">←</button>
      <div style="font-size:13px;color:var(--muted);font-weight:700">${state.isNew?'🆕 新客':'🐾 回訪客'} · 第 2 步</div>
    </div>
    <div class="q-title">你是怎麼知道<br>喵模會館的？</div>
    <div class="q-sub">請點選最主要的一個來源</div>
    <div class="src-list">
      ${SRC.map((s,i)=> i<SRC.length-1
        ? `<button class="src-btn" data-src="${i}"><span class="emo">${s.emo}</span>${s.label}</button>`
        : `<button class="src-btn other" data-src="${i}"><span class="emo">${s.emo}</span>其他（請輸入）<span class="arr">›</span></button>`
      ).join("")}
    </div>`;
  regCard.querySelector("#back2").onclick=()=>{ state.step=1; renderReg(); };
  regCard.querySelectorAll(".src-btn").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.src;
    if(SRC[i].key==="其他"){ state.step=3; renderReg(); }
    else { commit(i,""); }
  });
}
function renderStep3(){
  regCard.innerHTML=`
    <div class="step-head">
      <button class="back" id="back3">←</button>
      <div style="font-size:13px;color:var(--muted);font-weight:700">✏️ 其他來源 · 自行填寫</div>
    </div>
    <div class="q-title">請告訴我們：<br>你是從哪裡知道的呢？</div>
    <div class="q-sub">例如：電視採訪、雜誌、外送平台…</div>
    <div class="other-wrap">
      <textarea class="other-input" id="otherIn" maxlength="30" placeholder="請輸入…">${escapeHtml(state.noteDraft)}</textarea>
      <div class="counter"><span id="cc">${state.noteDraft.length}</span> / 30</div>
      <button class="big-btn btn-rose" id="otherSend" style="justify-content:center;margin-top:4px">${pawMini('#fff')} 送出並記錄</button>
    </div>`;
  const ta=regCard.querySelector("#otherIn"), cc=regCard.querySelector("#cc");
  ta.oninput=()=>{ state.noteDraft=ta.value; cc.textContent=ta.value.length; saveUI(); };
  regCard.querySelector("#back3").onclick=()=>{ state.step=2; renderReg(); };
  regCard.querySelector("#otherSend").onclick=()=>{
    const note=ta.value.trim();
    commit(SRC.length-1, note);
  };
  setTimeout(()=>ta.focus(),50);
}
let doneTimer=null, doneCd=null;
function renderDone(){
  const s=state._lastSrc;
  const srcPart = (s==null) ? '' : ' · '+SRC[s].label+(state._lastNote?'（'+escapeHtml(state._lastNote)+'）':'');
  const title = state.isNew ? '謝謝你告訴我們！' : '歡迎回來！';
  regCard.innerHTML=`
    <div class="done-wrap">
      <div class="done-title"><span class="spark">✦</span> ${title}<span class="spark">✦</span></div>
      ${catSVG().replace('<svg','<svg style="width:120px;height:128px"')}
      <div class="mini-summary">${pawMini('currentColor')} 已記錄 · ${state.isNew?'新客':'回訪'}${srcPart} · ${state._lastTime}</div>
      <div class="done-sub">希望下次還能見到你喔～ 🐾</div>
      <button class="big-btn btn-tan" id="doneBtn" style="justify-content:center"><span class="ico">${pawMini('currentColor')}</span>完成（<span id="cd">3</span> 秒後自動返回）</button>
    </div>`;
  regCard.querySelector("#doneBtn").onclick=finishDone;
  let n=3; const cdEl=regCard.querySelector("#cd");
  clearInterval(doneCd); clearTimeout(doneTimer);
  doneCd=setInterval(()=>{ n--; if(cdEl)cdEl.textContent=n; if(n<=0)clearInterval(doneCd); },1000);
  doneTimer=setTimeout(finishDone,3000);
}
function finishDone(){
  clearInterval(doneCd); clearTimeout(doneTimer);
  state.step=1; state.noteDraft=""; renderReg();
}
function commit(srcIdx, note){
  const rec=addRecord(state.isNew, srcIdx, note);
  state._lastSrc=srcIdx; state._lastNote=note; state._lastTime=minToHM(rec.t); state._lastRecDate=rec.date;
  state.step=4; state.noteDraft="";
  renderReg();
  if(state.mode==="stats") renderStats();
}
function updateTodayTally(){
  const el=document.getElementById("todayTally"); if(!el)return;
  const t=todayStr();
  const todays=realRecords.filter(r=>r.date===t);
  if(todays.length===0){ el.innerHTML=`今天還沒有登記紀錄，開始記錄第一位客人吧 🐾`; return; }
  const nw=todays.filter(r=>r.isNew).length;
  el.innerHTML=`今天已登記 <b>${todays.length}</b> 位 · 新客 <b>${nw}</b> · 回訪 <b>${todays.length-nw}</b>`;
}
function escapeHtml(s){ return (s||"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ==================== RENDER: STATS ====================
const NAV=[
  {k:"overview", emo:"🏠", label:"總覽", title:"統計總覽"},
  {k:"records",  emo:"👥", label:"來客紀錄", title:"來客紀錄（原始明細）"},
  {k:"sources",  emo:"📊", label:"來源統計", title:"客人從哪裡知道我們？"},
  {k:"newret",   emo:"🐾", label:"新客 / 回訪", title:"新客 / 回訪分析"},
  {k:"daily",    emo:"📅", label:"每日統計", title:"每日統計"},
  {k:"settings", emo:"⚙️", label:"設定", title:"設定"},
];
function buildSidebar(){
  document.getElementById("sbNav").innerHTML=NAV.map(n=>
    `<button class="sb-item ${n.k===state.section?'active':''}" data-sec="${n.k}"><span class="emo">${n.emo}</span>${n.label}</button>`).join("");
  document.querySelectorAll(".sb-item").forEach(b=>b.onclick=()=>{ state.section=b.dataset.sec; buildSidebar(); renderStats(); });
  document.getElementById("sbCat").innerHTML=`<div style="color:var(--espresso-ink);width:44px">${smallCat()}</div>`;
  document.getElementById("sbCatBig").innerHTML=catSVG();
}
function renderStats(){
  saveUI();
  syncChips();
  const nav=NAV.find(n=>n.k===state.section)||NAV[0];
  document.getElementById("secHeading").textContent=nav.title;
  // date box visibility
  document.getElementById("dateBox").style.display = (state.filter==="custom")?"inline-flex":"none";
  const recs=filtered();
  const body=document.getElementById("secBody");
  if(state.section==="overview") body.innerHTML=viewOverview(recs);
  else if(state.section==="records") body.innerHTML=viewRecords(recs);
  else if(state.section==="sources") body.innerHTML=viewSources(recs);
  else if(state.section==="newret") body.innerHTML=viewNewRet(recs);
  else if(state.section==="daily") body.innerHTML=viewDaily(recs);
  else if(state.section==="settings") body.innerHTML=viewSettings();
  postRender(recs);
}
function syncChips(){
  document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("active", c.dataset.f===state.filter));
}
function rangeLabel(){
  const [s,e]=activeRange();
  return s.replace(/-/g,"/")+" ～ "+e.replace(/-/g,"/");
}

function tilesHTML(st){
  const [s,e]=activeRange();
  const days=Math.max(1,daysBetween(s,e));
  const avg=(st.total/days);
  return `<div class="tiles">
    <div class="tile"><div class="lbl"><span class="emo">👥</span>總來客數</div><div class="val"><span class="num">${st.total.toLocaleString()}</span><span class="unit">人</span></div><div class="sub dash">${rangeLabel()}</div></div>
    <div class="tile rose"><div class="lbl"><span class="emo">🆕</span>第一次來（新客）</div><div class="val"><span class="num">${st.nw.toLocaleString()}</span><span class="unit">人</span></div><div class="sub">${st.newPct.toFixed(1)}%</div></div>
    <div class="tile tan"><div class="lbl"><span class="emo">🐾</span>來過（回訪客）</div><div class="val"><span class="num">${st.ret.toLocaleString()}</span><span class="unit">人</span></div><div class="sub">${(100-st.newPct).toFixed(1)}%</div></div>
    <div class="tile gold"><div class="lbl"><span class="emo">☕</span>平均每日來客</div><div class="val"><span class="num">${avg.toFixed(1)}</span><span class="unit">人</span></div><div class="sub dash">共 ${days} 天</div></div>
  </div>`;
}
function donutHTML(st){
  const total=st.srcTotal||1;
  const entries=SRC.map((s,i)=>({...s,i,cnt:st.bySrc[i],pct:st.bySrc[i]/total*100})).filter(e=>e.cnt>0).sort((a,b)=>b.cnt-a.cnt);
  const R=52, C=2*Math.PI*R; let off=0;
  const rings=entries.map(e=>{
    const len=e.cnt/total*C;
    const seg=`<circle cx="70" cy="70" r="${R}" fill="none" stroke="${e.color}" stroke-width="20" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"><title>${e.label}：${e.cnt} 人（${e.pct.toFixed(1)}%）</title></circle>`;
    off+=len; return seg;
  }).join("");
  const legend=SRC.map((s,i)=>({s,i,c:st.bySrc[i]})).sort((a,b)=>b.c-a.c).map(({s,i,c})=>{const p=c/total*100;return `<div class="leg-row"><span class="dot" style="background:${s.color}"></span><span class="name">${s.label}</span><span class="pct">${p.toFixed(0)}%</span><span class="cnt">${c}</span></div>`;}).join("");
  return `<div class="panel"><div class="section-title">${pawMini('var(--rose)')} 新客從哪裡知道我們？<span style="font-weight:600;color:var(--muted);font-size:13px">（新客來源）</span></div>
    <div class="donut-wrap">
      <div class="donut"><svg viewBox="0 0 140 140" width="190" height="190">${rings||`<circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--inset)" stroke-width="20"/>`}</svg>
        <div class="center"><div class="t1">新客</div><div class="t2 num">${st.srcTotal.toLocaleString()}</div><div class="t3">人</div></div>
      </div>
      <div class="legend">${legend}</div>
    </div></div>`;
}
function trendHTML(recs){
  // last up-to-14 days of range with data span
  const [s,e]=activeRange();
  let days=[]; let cur=new Date(e+"T00:00");
  const nDays=Math.min(14, daysBetween(s,e));
  for(let i=0;i<nDays;i++){ days.unshift(pad2date(cur)); cur.setDate(cur.getDate()-1); }
  const map={}; days.forEach(d=>map[d]={nw:0,ret:0});
  recs.forEach(r=>{ if(map[r.date]){ if(r.isNew)map[r.date].nw++; else map[r.date].ret++; } });
  const nwArr=days.map(d=>map[d].nw), retArr=days.map(d=>map[d].ret);
  const maxV=Math.max(1,...nwArr,...retArr);
  const W=520,H=200, padL=34,padR=14,padT=14,padB=30;
  const iw=W-padL-padR, ih=H-padT-padB;
  const x=i=>padL+(days.length<=1?iw/2:iw*i/(days.length-1));
  const y=v=>padT+ih-(v/maxV)*ih;
  const line=(arr,col)=>{
    const pts=arr.map((v,i)=>`${x(i)},${y(v)}`).join(" ");
    const dots=arr.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3.6" fill="${col}"/>`).join("");
    return `<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>${dots}`;
  };
  const grid=[0,.25,.5,.75,1].map(f=>{const yy=padT+ih-f*ih;const val=Math.round(maxV*f);return `<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${padL-6}" y="${yy+4}" text-anchor="end" font-size="10" fill="var(--muted)">${val}</text>`;}).join("");
  const xlabels=days.map((d,i)=>{ if(days.length>8 && i%2!==0 && i!==days.length-1) return ""; const mmdd=(+d.slice(5,7))+"/"+(+d.slice(8,10)); return `<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--muted)">${mmdd}</text>`;}).join("");
  return `<div class="panel"><div class="section-title">${pawMini('var(--tan-deep)')} 新客 / 回訪趨勢</div>
    <div class="chart-legend"><span><i class="k" style="background:var(--rose)"></i>新客</span><span><i class="k" style="background:var(--tan-deep)"></i>回訪客</span></div>
    <svg class="linechart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${grid}${line(retArr,'var(--tan-deep)')}${line(nwArr,'var(--rose)')}${xlabels}</svg></div>`;
}
function dailyTableHTML(recs, limit){
  const rows=dailyBreakdown(recs);
  const shown=limit?rows.slice(0,limit):rows;
  const head=`<tr><th>日期</th><th>總人數</th><th>新客</th><th>回訪</th>${SRC.map(s=>`<th>${s.label.replace(' / Google Maps','')}</th>`).join("")}</tr>`;
  const body=shown.map(d=>{
    const wd="日一二三四五六"[new Date(d.date+"T00:00").getDay()];
    return `<tr><td>${d.date.replace(/-/g,"/")} (${wd})</td><td><b>${d.total}</b></td><td>${d.nw}</td><td>${d.ret}</td>${d.src.map(v=>`<td>${v||"–"}</td>`).join("")}</tr>`;
  }).join("");
  if(shown.length===0) return `<div class="empty">這個區間還沒有資料 🐾</div>`;
  return `<div class="table-scroll"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
}

function viewOverview(recs){
  const st=computeStats(recs);
  return tilesHTML(st)+`<div class="panels">${donutHTML(st)}${trendHTML(recs)}</div>`+
    `<div class="panel full"><div class="section-title">${pawMini('var(--sage)')} 每日統計列表 <span style="font-weight:600;color:var(--muted);font-size:13px">（近 ${Math.min(10,dailyBreakdown(recs).length)} 天）</span></div>${dailyTableHTML(recs,10)}</div>`;
}
function viewSources(recs){
  const st=computeStats(recs); const total=st.srcTotal||1;
  const entries=SRC.map((s,i)=>({...s,i,cnt:st.bySrc[i],pct:st.bySrc[i]/total*100})).sort((a,b)=>b.cnt-a.cnt);
  const maxc=Math.max(1,...st.bySrc);
  const bars=entries.map(e=>`<div class="bar-row"><span class="bl"><span class="dot" style="background:${e.color}"></span>${e.label}</span><div class="bar-track"><div class="bar-fill" style="width:${e.cnt/maxc*100}%;background:${e.color}"></div></div><span class="bv">${e.cnt}</span></div>`).join("");
  return tilesHTML(st)+
    `<div class="mini-note" style="margin:-6px 0 16px">🗺️ 來源只統計「新客」——回訪客不會被問來源,所以這裡加總 = 新客數（${st.srcTotal.toLocaleString()} 人）。</div>`+
    `<div class="panels">${donutHTML(st)}<div class="panel"><div class="section-title">${pawMini('var(--rose)')} 新客來源排行</div><div class="bars">${bars}</div></div></div>`;
}
function viewNewRet(recs){
  const st=computeStats(recs);
  const nwPct=st.newPct, retPct=100-st.newPct;
  return tilesHTML(st)+
    `<div class="panels"><div class="panel"><div class="section-title">${pawMini('var(--rose)')} 新客 vs 回訪佔比</div>
      <div style="display:flex;height:34px;border-radius:10px;overflow:hidden;margin:8px 0 16px;border:1px solid var(--line)">
        <div style="width:${nwPct}%;background:var(--rose)"></div><div style="width:${retPct}%;background:var(--tan-deep)"></div></div>
      <div class="bars">
        <div class="bar-row"><span class="bl"><span class="dot" style="background:var(--rose)"></span>新客</span><div class="bar-track"><div class="bar-fill" style="width:${nwPct}%;background:var(--rose)"></div></div><span class="bv">${st.nw}</span></div>
        <div class="bar-row"><span class="bl"><span class="dot" style="background:var(--tan-deep)"></span>回訪客</span><div class="bar-track"><div class="bar-fill" style="width:${retPct}%;background:var(--tan-deep)"></div></div><span class="bv">${st.ret}</span></div>
      </div>
      <div class="mini-note" style="margin-top:12px">新客比例 <b style="color:var(--rose-ink)">${nwPct.toFixed(1)}%</b>，回訪比例 <b style="color:var(--tan-ink)">${retPct.toFixed(1)}%</b></div>
    </div>${trendHTML(recs)}</div>`;
}
function viewDaily(recs){
  return `<div class="panel full"><div class="section-title">${pawMini('var(--sage)')} 每日統計（${rangeLabel()}）</div>${dailyTableHTML(recs)}</div>`;
}
function viewRecords(recs){
  const sorted=recs.slice().sort((a,b)=> a.date!==b.date ? (a.date<b.date?1:-1) : b.t-a.t);
  const rows=sorted.map(r=>{
    const wd="日一二三四五六"[new Date(r.date+"T00:00").getDay()];
    const srcCell = (r.src==null)
      ? `<span class="note-x">—（回訪未問）</span>`
      : `<span class="src-tag"><span class="dot" style="background:${SRC[r.src].color}"></span>${SRC[r.src].label}${r.note?`<span class="note-x">（${escapeHtml(r.note)}）</span>`:''}</span>`;
    return `<tr><td>${r.date.replace(/-/g,"/")} (${wd})</td><td style="text-align:left">${minToHM(r.t)}</td><td style="text-align:left"><span class="pill ${r.isNew?'new':'ret'}">${r.isNew?'新客':'回訪'}</span></td><td style="text-align:left">${srcCell}</td></tr>`;
  }).join("");
  const head=`<tr><th>日期</th><th style="text-align:left">時間</th><th style="text-align:left">新客/回訪</th><th style="text-align:left">得知方式</th></tr>`;
  const tbl = sorted.length? `<div class="table-scroll"><table style="min-width:520px"><thead>${head}</thead><tbody>${rows}</tbody></table></div>` : `<div class="empty">這個區間還沒有紀錄 🐾</div>`;
  return `<div class="detail-controls">
      <div class="mini-note">共 <b>${sorted.length}</b> 筆原始紀錄 · ${rangeLabel()}</div>
      <button class="btn-outline" id="csvBtn" style="margin-left:auto">⬇️ 匯出 CSV</button>
    </div>${tbl}`;
}
function viewSettings(){
  const badge = syncMode!=="shared" ? `<span class="sync-badge local" id="syncBadge">📴 單機模式（尚未連線）</span>`
    : `<span class="sync-badge ${online?'shared':'local'}" id="syncBadge">${online?'🔗 多裝置同步中':'⏳ 連線中…'}</span>`;
  return `
    <div class="set-card"><div class="set-row">
      <div><div class="st">多裝置同步狀態</div><div class="sd">設定好 Google 試算表後，多台裝置登記的資料會自動彙整在一起；沒設定則為本機單機模式。</div></div>
      ${badge}
    </div></div>
    <div class="set-card">
      <div class="st">Google 試算表連線</div>
      <div class="sd" style="margin-bottom:10px">貼上你的 Apps Script 網頁應用程式網址（…/exec 結尾），這台裝置就會連上共同資料。若已在網頁檔內設定好，這裡會自動帶入、不必再貼。</div>
      <div style="display:flex; gap:8px; flex-wrap:wrap">
        <input id="backendIn" class="other-input" style="min-height:auto; padding:11px 14px; flex:1; min-width:220px; font-size:14px" placeholder="https://script.google.com/macros/s/AKfy…/exec" value="${escapeHtml(localStorage.getItem(LS_BACKEND)||'')}">
        <button class="btn-outline" id="backendSave">儲存並連線</button>
        <button class="btn-outline" id="backendTest">測試連線</button>
      </div>
      <div class="mini-note" id="backendMsg" style="margin-top:8px"></div>
    </div>
    <div class="set-card"><div class="set-row">
      <div><div class="st">顯示範例資料</div><div class="sd">目前顯示 1,248 筆示範資料，方便你先看整體長相。正式上線時關掉，畫面只留下真正登記的客人。</div></div>
      <button class="switch ${showDemo()?'on':''}" id="demoSwitch" role="switch" aria-checked="${showDemo()}"></button>
    </div></div>
    <div class="set-card"><div class="set-row">
      <div><div class="st">匯出資料</div><div class="sd">把目前篩選區間的原始明細下載成 CSV，可用 Excel 開啟。</div></div>
      <button class="btn-outline" id="csvBtn2">⬇️ 匯出 CSV</button>
    </div></div>
    <div class="set-card"><div class="set-row">
      <div><div class="st">清除真實登記紀錄</div><div class="sd">清空所有實際登記的客人資料（不含範例）。連線狀態下會一併清空 Google 試算表，此動作無法復原。</div></div>
      <button class="btn-danger" id="clearBtn">清除紀錄</button>
    </div></div>`;
}
function postRender(recs){
  // wire dynamic controls that appear inside sections
  const csv=document.getElementById("csvBtn")||document.getElementById("csvBtn2");
  document.querySelectorAll("#csvBtn,#csvBtn2").forEach(b=>b.onclick=()=>exportCSV(recs));
  const ds=document.getElementById("demoSwitch");
  if(ds) ds.onclick=()=>{ setShowDemo(!showDemo()); renderStats(); if(state.mode==='reg')renderReg(); };
  const cb=document.getElementById("clearBtn");
  if(cb) cb.onclick=clearReal;
  const bs=document.getElementById("backendSave");
  if(bs) bs.onclick=async()=>{
    const v=document.getElementById("backendIn").value.trim();
    setBackendUrl(v); const msg=document.getElementById("backendMsg");
    if(!v){ syncMode="local"; renderSyncBadges(); if(msg)msg.textContent="已清除連線，改為單機模式。"; return; }
    syncMode="shared"; if(msg)msg.textContent="連線中…";
    const ok=await refreshFromServer(); await flushOutbox(); startPolling();
    renderSyncBadges();
    if(msg)msg.textContent= ok? "✅ 連線成功！這台裝置已和共同資料同步。" : "⚠️ 連不上，請確認網址、以及部署權限設為「任何人」。";
    if(ok && state.mode==="stats") renderStats();
  };
  const bt=document.getElementById("backendTest");
  if(bt) bt.onclick=async()=>{
    const v=document.getElementById("backendIn").value.trim(); const msg=document.getElementById("backendMsg");
    if(!v){ if(msg)msg.textContent="請先貼上網址。"; return; }
    if(msg)msg.textContent="測試中…";
    try{ const r=await fetch(v+(v.indexOf("?")>=0?"&":"?")+"t="+Date.now()); const d=await r.json();
      if(msg)msg.textContent= (d&&d.ok)? `✅ 連線正常，目前試算表有 ${d.records?d.records.length:0} 筆資料。` : "⚠️ 有回應但格式不對，請確認 Apps Script 內容。"; }
    catch(e){ if(msg)msg.textContent="⚠️ 連不上，請確認網址與部署權限（任何人）。"; }
  };
}
function renderSyncBadges(){
  const b=document.getElementById("syncBadge"); if(!b)return;
  if(syncMode!=="shared"){ b.className="sync-badge local"; b.textContent="📴 單機模式（尚未連線）"; }
  else{ b.className="sync-badge "+(online?"shared":"local"); b.textContent=online?"🔗 多裝置同步中":"⏳ 連線中…"; }
}
async function clearReal(){
  if(!confirm("確定要清除所有真實登記紀錄嗎？此動作無法復原。")) return;
  realRecords=[]; saveLocalRecords(); setOutbox([]);
  const url=backendUrl();
  if(syncMode==="shared" && url){
    try{ await fetch(url, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({action:"clear"})}); }catch(e){}
  }
  renderStats(); toast("已清除真實登記紀錄");
}
async function exportCSV(recs){
  const sorted=recs.slice().sort((a,b)=> a.date!==b.date ? (a.date<b.date?1:-1) : b.t-a.t);
  const lines=[["日期","時間","新客/回訪","得知方式","備註"].join(",")];
  sorted.forEach(r=>lines.push([r.date, minToHM(r.t), r.isNew?"新客":"回訪", (r.src==null?"":SRC[r.src].label), (r.note||"").replace(/,/g,"，")].join(",")));
  const csv="﻿"+lines.join("\n");
  let dl=null; try{ dl=(window.claude&&window.claude.use)? await window.claude.use("downloads"):null; }catch(e){}
  if(dl){
    try{ await dl.save({filename:"喵模會館_來客明細.csv", data:csv}); toast("已匯出 CSV 🐾"); return; }
    catch(err){
      const code=err&&err.code;
      if(code==="declined"||code==="rate_limited") return;
      if(code==="extension_not_enabled"){
        try{ await dl.save({filename:"喵模會館_來客明細.txt", data:csv}); toast("已匯出（.txt，可用 Excel 開啟）🐾"); return; }
        catch(e2){ if(e2&&(e2.code==="declined"||e2.code==="rate_limited")) return; }
      }
      // otherwise fall through to browser download
    }
  }
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob); const a=document.createElement("a");
  a.href=url; a.download="喵模會館_來客明細.csv"; a.click(); setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast("已匯出 CSV 🐾");
}

// ==================== chrome / toggles ====================
function toast(msg){ const t=document.getElementById("toast"); t.innerHTML=pawMini('var(--gold)')+" "+msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2200); }
function setMode(m){
  state.mode=m; saveUI();
  document.getElementById("reg").style.display = m==="reg"?"flex":"none";
  document.getElementById("stats").classList.toggle("on", m==="stats");
  if(m==="reg") renderReg(); else renderStats();
  window.scrollTo(0,0);
}
document.getElementById("goStats").onclick=()=>setMode("stats");
document.getElementById("goReg").onclick=()=>setMode("reg");
document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{
  state.filter=c.dataset.f;
  if(state.filter==="custom"){ if(!state.cStart)state.cStart=monthStart(); if(!state.cEnd)state.cEnd=todayStr();
    document.getElementById("dStart").value=state.cStart; document.getElementById("dEnd").value=state.cEnd; }
  renderStats();
});
document.getElementById("dStart").onchange=e=>{ state.cStart=e.target.value; renderStats(); };
document.getElementById("dEnd").onchange=e=>{ state.cEnd=e.target.value; renderStats(); };

// theme
function applyTheme(t){ if(t==="dark"||t==="light") document.documentElement.setAttribute("data-theme",t); else document.documentElement.removeAttribute("data-theme");
  document.getElementById("themeToggle").textContent = curTheme()==="dark"?"☀️":"🌙"; }
function curTheme(){ const a=document.documentElement.getAttribute("data-theme"); if(a)return a; return window.matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"; }
document.getElementById("themeToggle").onclick=()=>{ const n=curTheme()==="dark"?"light":"dark"; try{localStorage.setItem(LS_THEME,n);}catch(e){} applyTheme(n); };
(function initTheme(){ let t=null; try{t=localStorage.getItem(LS_THEME);}catch(e){} applyTheme(t||"system"); })();

document.getElementById("decoCats").innerHTML=`<span style="color:var(--tan-deep)">${smallCat()}</span><span style="color:var(--muted)">${smallCat()}</span><span style="color:var(--tan)">${smallCat()}</span>`;

// refresh when the tab/app comes back to the foreground
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && syncMode==="shared"){ refreshFromServer().then(ok=>{ renderSyncBadges(); if(ok&&state.mode==="stats")renderStats(); }); } });

// ---------- boot ----------
buildSidebar();
setMode(state.mode);
initStorage().then(()=>{
  renderSyncBadges();
  if(state.mode==="reg"){ renderReg(); } else { renderStats(); }
});
})();
</script>
</body>
